# GitHub Actions CI for FinShield
name: FinShield CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: black --check .
      - run: ruff check .
      - run: mypy api/ features/ models/ ingestion/ --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: finshield_test
          POSTGRES_USER: finshield_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://finshield_user:test_password@localhost:5432/finshield_test
      MLFLOW_TRACKING_URI: sqlite:///mlruns_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t finshield-api:ci .
      - name: Build dashboard image
        run: docker build -f Dockerfile.streamlit -t finshield-dashboard:ci .
